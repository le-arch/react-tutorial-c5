services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: piggydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d piggydb"]
      interval: 5s
      retries: 10
      timeout: 5s
    ports:
      - "5432:5432"
    networks:
      - piggy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/piggydb?sslmode=disable
      PORT: "8080"
      FRONTEND_URL: http://localhost:3000
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy
    networks:
      - piggy-network

volumes:
  pgdata:

networks:
  piggy-network:
    driver: bridge