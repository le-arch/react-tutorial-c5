version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "decimal"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: true
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
            nullable: true
          - column: "transactions.created_at"
            go_type: "time.Time"
          - column: "users.created_at"
            go_type: "time.Time"